[project]
name = "nonebot-plugin-grok-bot"
version = "0.1.0"
description = "NoneBot2 plugin bridging chats with Grok Bot via MCP server + webhook"
readme = "README.md"
authors = [
    { name = "Yan", email = "1964649083@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.15.1",
    "mcp>=1.9",
    "nonebot-plugin-alconna>=0.57",
    "nonebot2>=2.4.0",
]

[project.optional-dependencies]
savepic = [
    "nonebot-plugin-savepic>=0.6.7",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-savepic",
    "nonebot2[aiohttp,fastapi,httpx]>=2.5.0",
    "nonebug>=0.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.nonebot]
plugins = ["nonebot_plugin_grok_bot"]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.uv.sources]
nonebot-plugin-savepic = { git = "https://github.com/Yan-Zero/nonebot-plugin-savepic" }
